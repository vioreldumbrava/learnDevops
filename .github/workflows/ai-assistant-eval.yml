name: ai-assistant manual eval

# Runs the RAG evaluation against a REAL model. This needs to run inference, so it
# uses a tiny CPU model (llama3.2:1b) on the GitHub-hosted runner — slow, and best
# moved to a self-hosted/GPU runner for a bigger model. Manual runs only.
on:
  workflow_dispatch:
    inputs:
      prompt_version:
        description: "System prompt to evaluate (A/B: dispatch once with v1, once with v2 — lab 08)"
        default: "v1"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      CHAT_MODEL: llama3.2:1b
      EMBED_MODEL: nomic-embed-text
      # Compose passes this through to rag-api; nightly runs use v1.
      PROMPT_VERSION: ${{ github.event.inputs.prompt_version || 'v1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Start the stack (with the local model profile)
        working-directory: ai-assistant
        run: docker compose --profile local-llm up -d --build

      - name: Pull models (CPU)
        working-directory: ai-assistant
        run: |
          docker compose exec -T ollama ollama pull "$CHAT_MODEL"
          docker compose exec -T ollama ollama pull "$EMBED_MODEL"

      - name: Ingest docs
        working-directory: ai-assistant
        run: docker compose run --rm ingest

      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/healthz && break || sleep 3
          done

      - name: Run evaluation
        run: python ai-assistant/eval/eval.py
        env:
          EVAL_API_URL: http://localhost:8000/api/chat
          EVAL_THRESHOLD: "0.6"   # lenient: a 1b model is weaker than what you'd run locally
          EVAL_REPORT_MD: report.md

      # The per-category table lands on the run's summary page — an eval nobody
      # reads is an eval nobody trusts (lab 08).
      - name: Publish report to job summary
        if: always()
        run: |
          echo "### prompt_version: $PROMPT_VERSION" >> "$GITHUB_STEP_SUMMARY"
          [ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-report-${{ env.PROMPT_VERSION }}
          path: |
            report.md
            ai-assistant/eval/report.json
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        working-directory: ai-assistant
        run: docker compose logs --tail=120

      - name: Teardown
        if: always()
        working-directory: ai-assistant
        run: docker compose down -v
