name: AWS Terraform plan (OIDC)

# Cloud plans run only from trusted branch code or an explicit manual dispatch.
# AWS authentication is exclusively GitHub OIDC -> STS AssumeRoleWithWebIdentity;
# do not add long-lived AWS access keys as repository secrets.
on:
  push:
    branches: [main, master]
    paths:
      - "deploy/eks/**"
      - "deploy/terraform/**"
      - ".github/workflows/aws-terraform-plan.yml"
  pull_request:
    paths:
      - "deploy/eks/**"
      - "deploy/terraform/**"
      - ".github/workflows/aws-terraform-plan.yml"
  workflow_dispatch:
    inputs:
      root_module:
        description: Terraform root to plan (aws-baseline requires the lab 16 EC2 instance)
        required: true
        default: deploy/eks
        type: choice
        options:
          - deploy/eks
          - deploy/terraform
          - deploy/terraform/aws-baseline

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-north-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # A harmless documentation-only value satisfies the EC2 root's required input.
  TF_VAR_allowed_ssh_cidr: 127.0.0.1/32

jobs:
  plan:
    # Never issue an AWS token to code from a fork. Same-repository PRs still
    # cross the protected aws-plan environment approval boundary.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Plan ${{ matrix.root_module }}
    runs-on: ubuntu-latest
    environment: aws-plan
    strategy:
      fail-fast: false
      matrix:
        # Automatic plans avoid aws-baseline because that root intentionally
        # requires the learner's lab 16 EC2 instance. It remains manually
        # selectable once that prerequisite exists.
        root_module: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.root_module) || '["deploy/terraform","deploy/eks"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assume the read-only Terraform plan role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-terraform-plan

      - name: Verify caller identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"

      - name: Initialize
        run: terraform -chdir="${{ matrix.root_module }}" init -input=false

      - name: Plan
        run: >-
          terraform -chdir="${{ matrix.root_module }}" plan
          -input=false -no-color -lock-timeout=2m
