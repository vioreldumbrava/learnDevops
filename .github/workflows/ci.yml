name: CI

# Build, test, scan and publish the DevOps Dojo images.
#   - Pull requests: build + test + scan, but do NOT push images.
#   - Pushes to main/master and version tags: also push images to GHCR.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Test & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: app/api/go.sum

      - name: Go vet & test
        working-directory: app/api
        run: |
          go vet ./...
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Frontend install & build
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Validate Compose files
        run: |
          docker compose -f deploy/compose/compose.yaml config >/dev/null
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.observability.yaml config >/dev/null

      # Two-tier scan policy (lab 41): HIGH stays visible in the log (report-only),
      # CRITICAL fails the build. Exceptions live in .trivyignore, each justified.
      - name: Trivy filesystem scan (report HIGH+)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Trivy filesystem scan (gate on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: "true"
          trivyignores: .trivyignore
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # IaC checks (lab 39): fmt is non-negotiable style, validate catches broken
  # references per ROOT module, tflint catches provider-specific mistakes, and
  # checkov flags insecure patterns (report-only here, like the Trivy fs scan).
  # No `terraform plan` in CI yet — that needs AWS credentials (see lab 39's
  # exercise on GitHub OIDC).
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff deploy/

      - name: terraform validate (every root module)
        run: |
          for dir in deploy/terraform deploy/terraform/state-backend \
                     deploy/terraform/envs/dev deploy/terraform/envs/prod \
                     deploy/terraform/rds deploy/eks; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate -no-color
          done

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          for dir in deploy/terraform deploy/terraform/modules/ec2-app deploy/eks; do
            echo "==> $dir"
            tflint --chdir="$dir"
          done

      - name: checkov (IaC security scan, report-only)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deploy
          framework: terraform
          soft_fail: true

  # ---------------------------------------------------------------------------
  build:
    name: Build, scan & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for keyless image signing (lab 41)
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- API image ---
      - name: Metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push (api)
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: app/api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          sbom: true            # generate & attach a Software Bill of Materials
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend image ---
      - name: Metadata (frontend)
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push (frontend)
        id: build-fe
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the actually-published API image by its immutable digest.
      - name: Trivy image scan (api, report HIGH+)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api@${{ steps.build-api.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Trivy image scan (api, gate on CRITICAL)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api@${{ steps.build-api.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: "true"
          trivyignores: .trivyignore
          exit-code: "1"

      # Keyless signing (lab 41): this workflow run's OIDC identity signs the
      # DIGESTS; signatures land next to the images in GHCR, the proof in the
      # public Rekor transparency log. Verified at admission by Kyverno
      # (deploy/k8s/policies/verify-image-signatures.yaml).
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless, by digest)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_PREFIX}/api@${{ steps.build-api.outputs.digest }}"
          cosign sign --yes "${REGISTRY}/${IMAGE_PREFIX}/frontend@${{ steps.build-fe.outputs.digest }}"
