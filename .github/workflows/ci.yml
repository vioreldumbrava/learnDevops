name: CI

# Build, test, scan and publish the DevOps Dojo images.
#   - Pull requests: build + test + scan, but do NOT push images.
#   - Pushes to main/master and version tags: also push images to GHCR.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Test & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: app/api/go.sum

      - name: Go vet & test
        working-directory: app/api
        run: |
          go vet ./...
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Frontend install & build
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Validate Compose files
        run: |
          docker compose -f deploy/compose/compose.yaml config >/dev/null
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.observability.yaml config >/dev/null

      - name: Trivy filesystem scan (dependencies & config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          # Report only in this learning setup. To make CI GATE on findings,
          # set exit-code: "1".
          exit-code: "0"

  # ---------------------------------------------------------------------------
  build:
    name: Build, scan & push images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- API image ---
      - name: Metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push (api)
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: app/api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          sbom: true            # generate & attach a Software Bill of Materials
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend image ---
      - name: Metadata (frontend)
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push (frontend)
        id: build-fe
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the actually-published API image by its immutable digest.
      - name: Trivy image scan (api)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api@${{ steps.build-api.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "0"
