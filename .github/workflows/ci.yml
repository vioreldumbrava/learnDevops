name: CI

# Test and validate every change. Pull requests build images without credentials;
# trusted pushes additionally publish, attest, scan, and sign images in GHCR.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Test & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"
          cache-dependency-path: app/api/go.sum

      - name: Go vet & test
        working-directory: app/api
        run: |
          go vet ./...
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Frontend install, test & build
        working-directory: app/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Validate every supported Compose combination
        run: python3 scripts/ci/check_compose.py

      # HIGH findings remain visible; unignored CRITICAL findings fail the build.
      - name: Trivy filesystem scan (report HIGH+)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Trivy filesystem scan (gate on CRITICAL)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: "true"
          trivyignores: .trivyignore
          exit-code: "1"

  # ---------------------------------------------------------------------------
  api-py:
    name: API (Python) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/api-py/requirements-dev.txt

      - name: Install & test
        working-directory: app/api-py
        run: |
          pip install -r requirements-dev.txt
          pytest

  # ---------------------------------------------------------------------------
  operator:
    name: Operator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25"
          cache-dependency-path: dojo-operator/go.sum

      - name: Go vet & test
        working-directory: dojo-operator
        run: |
          go vet ./...
          go test ./...

      - name: Build operator image and verify its numeric non-root identity
        working-directory: dojo-operator
        run: |
          docker build -t devops-dojo/operator:ci .
          test "$(docker image inspect devops-dojo/operator:ci --format '{{.Config.User}}')" = "65532:65532"

  # ---------------------------------------------------------------------------
  docs:
    name: Curriculum & documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate the curriculum manifest and generated artifacts
        run: python scripts/ci/check_curriculum.py --check

      - name: Check repository-local Markdown and image links
        run: python scripts/ci/check_markdown_links.py

      - name: Verify every third-party Action is pinned by full commit SHA
        run: |
          if grep -RInP 'uses:\s+[^#[:space:]]+@(?![0-9a-f]{40}(?:[[:space:]]|$))' .github/workflows; then
            echo "Every third-party Action must use a full 40-character commit SHA." >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  migrations:
    name: Migration baseline smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Apply, roll back, and re-apply all migrations
        run: python scripts/ci/migration_smoke.py

  # ---------------------------------------------------------------------------
  manifests:
    name: Helm & workload security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt

      - name: Install manifest checker dependencies
        run: pip install -r scripts/ci/requirements.txt

      - name: Lint chart defaults and environment overlays
        run: |
          chart=deploy/k8s/helm/devops-dojo
          helm lint "$chart"
          for environment in dev staging prod; do
            helm lint "$chart" -f "$chart/values-${environment}.yaml"
          done
          helm lint "$chart" --set gateway.enabled=false --set ingress.enabled=true

      - name: Render every supported values set
        run: |
          chart=deploy/k8s/helm/devops-dojo
          helm template dojo "$chart" > "$RUNNER_TEMP/helm-default.yaml"
          for environment in dev staging prod; do
            helm template "dojo-${environment}" "$chart" \
              -f "$chart/values-${environment}.yaml" \
              > "$RUNNER_TEMP/helm-${environment}.yaml"
          done
          helm template dojo-eks "$chart" \
            --set gateway.className=aws-alb \
            --set gateway.localEnvoyProxy.enabled=false \
            --set secrets.create=false \
            > "$RUNNER_TEMP/helm-eks.yaml"
          helm template dojo-legacy "$chart" \
            --set gateway.enabled=false \
            --set ingress.enabled=true \
            > "$RUNNER_TEMP/helm-legacy.yaml"

      - name: Gate workload security for chart and primary raw manifests
        run: >-
          python scripts/ci/check_workload_security.py
          "$RUNNER_TEMP/helm-default.yaml"
          "$RUNNER_TEMP/helm-dev.yaml"
          "$RUNNER_TEMP/helm-staging.yaml"
          "$RUNNER_TEMP/helm-prod.yaml"
          "$RUNNER_TEMP/helm-eks.yaml"
          "$RUNNER_TEMP/helm-legacy.yaml"
          deploy/k8s/base/*.yaml
          deploy/k8s/rollouts/rollout-api.yaml
          deploy/k8s/policies/*-image-test-pod.yaml
          dojo-operator/config/manager/deployment.yaml
          ai-assistant/k8s/*.yaml
          deploy/k8s/backup/s3-backup-cronjob.yaml

      # Intentionally unsafe teaching manifests remain report-only; the
      # production-shaped manifest sets above are blocking gates.
      - name: Checkov Kubernetes scan (full teaching tree, report-only)
        uses: bridgecrewio/checkov-action@68260132005eaae0e6f84c7a73cc3b1532f678bf # v12.3058.0
        with:
          directory: deploy/k8s
          framework: kubernetes
          soft_fail: true

  # ---------------------------------------------------------------------------
  # Credential-free IaC validation runs here. Real least-privilege AWS plans use
  # GitHub OIDC in .github/workflows/aws-terraform-plan.yml.
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff deploy/

      - name: terraform validate (every root module)
        run: |
          for dir in deploy/terraform deploy/terraform/state-backend \
                     deploy/terraform/envs/dev deploy/terraform/envs/prod \
                     deploy/terraform/rds deploy/terraform/aws-baseline deploy/eks; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate -no-color
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: tflint
        run: |
          tflint --init
          for dir in deploy/terraform deploy/terraform/modules/ec2-app \
                     deploy/terraform/aws-baseline deploy/eks; do
            echo "==> $dir"
            tflint --chdir="$dir"
          done

      - name: Checkov IaC security scan (report-only)
        uses: bridgecrewio/checkov-action@68260132005eaae0e6f84c7a73cc3b1532f678bf # v12.3058.0
        with:
          directory: deploy
          framework: terraform
          soft_fail: true

  # ---------------------------------------------------------------------------
  # Pull-request code receives no package or OIDC permissions and never logs in
  # to a registry. This still proves both Dockerfiles build successfully.
  build-pr:
    name: Build images (pull request, no credentials)
    if: github.event_name == 'pull_request'
    needs: [test, api-py, operator, docs, migrations, manifests, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: app/api
          push: false
          load: true
          tags: devops-dojo/api:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify API image uses a numeric non-root identity
        run: |
          test "$(docker image inspect devops-dojo/api:pr --format '{{.Config.User}}')" = "65532:65532"

      - name: Build frontend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: app/frontend
          push: false
          tags: devops-dojo/frontend:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Only trusted non-PR events receive GHCR and OIDC permissions.
  publish:
    name: Build, attest, scan, publish & sign images
    if: github.event_name != 'pull_request'
    needs: [test, api-py, operator, docs, migrations, manifests, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (api)
        id: meta-api
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push (api)
        id: build-api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: app/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata (frontend)
        id: meta-fe
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push (frontend)
        id: build-fe
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: app/frontend
          push: true
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (api, report HIGH+)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api@${{ steps.build-api.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Trivy image scan (api, gate on CRITICAL)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api@${{ steps.build-api.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: "true"
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      # Keyless signatures are attached to immutable digests and recorded in Rekor.
      - name: Sign images (keyless, by digest)
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_PREFIX}/api@${{ steps.build-api.outputs.digest }}"
          cosign sign --yes "${REGISTRY}/${IMAGE_PREFIX}/frontend@${{ steps.build-fe.outputs.digest }}"
