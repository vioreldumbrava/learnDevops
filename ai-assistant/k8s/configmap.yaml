apiVersion: v1
kind: ConfigMap
metadata:
  name: dojo-ai-config
  namespace: dojo-ai
data:
  # In-cluster Ollama (default). To use a model server on ANOTHER machine instead,
  # set this to its address (e.g. http://192.168.1.50:11434/v1) and skip ollama.yaml.
  OPENAI_BASE_URL: "http://ollama:11434/v1"
  # OPENAI_API_KEY lives in secret.yaml — config and credentials are different things.
  CHAT_MODEL: "llama3.2:3b"
  EMBED_MODEL: "nomic-embed-text"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "dojo_docs"
