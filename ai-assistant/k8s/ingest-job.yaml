# One-shot indexing Job. An initContainer git-clones the repo (so the docs are
# available in-cluster), then the main container embeds + upserts into Qdrant.
# Set REPO_URL to your fork. Run after Ollama has the embed model pulled.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
  namespace: dojo-ai
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: ingest # NetworkPolicies select pods by label (networkpolicy.yaml)
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: clone
          image: alpine/git:2.54.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: HOME
              value: /tmp
          args: ["clone", "--depth", "1", "https://github.com/OWNER/REPO.git", "/repo"]
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ingest
          image: dojo-ai/rag-api:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          command: ["python", "-m", "app.ingest"]
          env:
            - name: DOCS_PATHS
              value: "/repo/docs,/repo/labs,/repo/README.md"
          envFrom:
            - configMapRef:
                name: dojo-ai-config
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repo
          emptyDir: {}
        - name: tmp
          emptyDir: {}
