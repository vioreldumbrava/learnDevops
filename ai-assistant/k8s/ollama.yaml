# Ollama on Kubernetes. Models are large, so a PVC holds them and you pull once
# after the pod is up (see the lab). CPU works for small models; for GPU, add the
# NVIDIA device plugin and uncomment the resources.limits below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: dojo-ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: dojo-ai
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: dojo-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate # single writer to the models PVC
  template:
    metadata:
      labels:
        app: ollama
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: ollama/ollama:0.32.5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: HOME
              value: /home/ollama
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /home/ollama/.ollama
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits: { cpu: "4", memory: 8Gi }
            # For GPU nodes:
            #   limits:
            #     nvidia.com/gpu: 1
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
        - name: tmp
          emptyDir: {}
