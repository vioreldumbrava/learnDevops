# Credentials live in a Secret, not the ConfigMap — even when the value is a
# placeholder. The moment OPENAI_BASE_URL points at a hosted API, the key is a
# real credential, and "we'll move it to a Secret later" never happens later.
# Real deployments: Sealed Secrets / External Secrets Operator (lab 26).
apiVersion: v1
kind: Secret
metadata:
  name: dojo-ai-secrets
  namespace: dojo-ai
type: Opaque
stringData:
  OPENAI_API_KEY: "not-needed-for-local"
