server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The frontend container's own liveness endpoint (used by the Compose healthcheck).
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy API calls to the api service. Using a resolver + variable means Nginx
    # starts even if `api` is not up yet (returns 502 on request instead of failing
    # to boot), which keeps `docker compose up frontend` working standalone.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page-app fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
