# Optional self-hosted CI/CD overlay: Jenkins (lab 24). Its own overlay because
# it's heavy and independent of the app stack:
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.jenkins.yaml up -d --build jenkins
#
# Initial admin password:
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.jenkins.yaml exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
# UI: http://localhost:8088
name: devops-dojo

services:
  jenkins:
    build:
      context: ../jenkins
    image: devops-dojo/jenkins:lts
    # Local-learning shortcut so Jenkins can use the mounted Docker socket. The
    # socket is root-equivalent access to the host — the same caveat as local Alloy
    # in lab 11; see lab 19 for why you'd avoid this in production.
    user: root
    ports:
      - "127.0.0.1:8088:8080"   # web UI (container 8080 -> host 8088 to avoid the api's 8080)
      - "127.0.0.1:50000:50000" # inbound agent port
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins-home:
