# Observability overlay: the three pillars (metrics, logs, traces) + alerting.
# Add it on top of the base (and optionally dev/prod), e.g.:
#   docker compose -f deploy/compose/compose.yaml \
#     -f deploy/compose/compose.dev.yaml \
#     -f deploy/compose/compose.observability.yaml up --build
#
# Open Grafana at http://localhost:3001 (admin / admin by default).
name: devops-dojo

services:
  # Point the app at Tempo so traces are actually exported when this overlay runs.
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318

  # METRICS: Prometheus *pulls* /metrics from the targets listed in prometheus.yml
  # (api, itself, blackbox…) and evaluates alerts.yml. Config mounts are :ro on
  # purpose — config is code; the container must not modify it. The named volume
  # keeps the metrics history across restarts.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # ALERTING: Prometheus fires rules; Alertmanager groups, dedupes, silences and
  # routes them (to email/Slack/webhook — receivers live in alertmanager.yml).
  # Separate service because alert *routing* policy shouldn't live in the scraper.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  # ONE UI over all three pillars: the provisioning/ mount registers Prometheus,
  # Loki and Tempo as datasources AND loads the dashboards from files — no
  # click-ops, so a fresh `up` always yields a fully wired Grafana.
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # LOGS: Loki stores log lines but only indexes their *labels* (service, level…),
  # not the full text — that's why it's far cheaper to run than an ELK stack.
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  # LOG SHIPPER: discovers every container via the (read-only) Docker socket and
  # pushes their stdout/stderr to Loki with labels. Publishes no ports — it's a
  # push agent, nothing needs to reach it. The apps never know logging exists:
  # they just write to stdout (12-factor).
  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  # TRACES: Tempo receives OTLP spans on 4318 (that's the OTEL_EXPORTER_OTLP_ENDPOINT
  # the api/worker are pointed at above) and Grafana links log lines ↔ traces by ID.
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped

  # OUTSIDE-IN probe: Prometheus asks blackbox to HTTP-probe the app the way a
  # *user* would. Internal metrics can look healthy while the site is down —
  # this catches that class of failure (and feeds the uptime alert).
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
