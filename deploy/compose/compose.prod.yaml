# Production overlay: Caddy is the only public entrypoint (ports 80/443) and
# terminates TLS. The app services keep their 127.0.0.1-only host ports from the
# base file, so they are NOT reachable from the internet — Caddy reaches them by
# service name over the Compose network.
#
#   docker compose --env-file .env \
#     -f deploy/compose/compose.yaml \
#     -f deploy/compose/compose.prod.yaml \
#     up -d --build
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - api
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
