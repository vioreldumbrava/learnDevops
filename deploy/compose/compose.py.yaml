# Polyglot overlay (lab 50): swap the Go api+worker for the Python twin
# (app/api-py) WITHOUT touching anything else. Same service names, same port
# 8080, same db/redis/frontend — so the frontend and DB can't tell the
# difference. That's the whole demonstration: the API contract is the interface.
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.py.yaml up --build
#   # add -f deploy/compose/compose.dev.yaml too for the Vite dev frontend.
#
# Only three keys change per service: build context, image tag, and the
# start command / healthcheck (the Python image has no /api or /worker binary).
services:
  api:
    build:
      context: ../../app/api-py
    image: devops-dojo/api-py:dev
    healthcheck:
      # Override just the probe command; interval/timeout/retries stay inherited.
      # (The distroless Go image self-probed with `/api -healthcheck`; here we
      # have a Python interpreter, so use it.)
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').getcode()==200 else 1)"

  worker:
    build:
      context: ../../app/api-py
    image: devops-dojo/api-py:dev
    # Base set entrypoint ["/worker"] for the Go binary; point it at the Python
    # worker module instead (one image, two entrypoints — same pattern).
    entrypoint: ["python", "-m", "app.worker"]
