# ArgoCD Application: the single source of truth for what runs in the cluster.
# ArgoCD watches this Git path and continuously reconciles the cluster to match it
# (prune + self-heal). Edit OWNER/REPO to point at your fork.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-dojo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://github.com/OWNER/REPO.git
      targetRevision: main
      path: deploy/k8s/helm/devops-dojo
      helm:
        valuesObject:
          image:
            api:
              repository: ghcr.io/OWNER/REPO/api
              tag: sha-CHANGE_ME
              pullPolicy: IfNotPresent
            frontend:
              repository: ghcr.io/OWNER/REPO/frontend
              tag: sha-CHANGE_ME
              pullPolicy: IfNotPresent
          # The capstone never commits a plaintext password. The second source
          # contains the cluster-encrypted SealedSecret from lab 26; its
          # controller materializes this name. Lab 40 later changes the name to
          # the independently owned dojo-rds-secrets during the RDS handoff.
          secrets:
            name: dojo-secrets
            create: false
          postgres:
            enabled: true
          # The EKS bootstrap installs this class. It provisions the capstone's
          # internet-facing ALB from the chart's Gateway + HTTPRoute.
          gateway:
            className: aws-alb
            localEnvoyProxy:
              enabled: false
    - repoURL: https://github.com/OWNER/REPO.git
      targetRevision: main
      path: deploy/secrets/capstone
      directory:
        recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-dojo

  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual drift back to Git state
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        gateway-access: dojo
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.35
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.35
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.35
