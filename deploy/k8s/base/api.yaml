apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devops-dojo
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: devops-dojo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: devops-dojo/api:dev
          imagePullPolicy: IfNotPresent   # kind load docker-image (no registry needed)
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dojo-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dojo-secrets
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
