# Routes external traffic: /api and /healthz to the API, everything else to the
# frontend. (Compare: this replaces Caddy from the Compose world.) Assumes an
# ingress-nginx controller is installed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dojo
  namespace: devops-dojo
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
