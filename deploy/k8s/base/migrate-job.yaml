# One-shot schema migration, mirroring the Compose `migrate` service.
# The SQL is supplied via a ConfigMap created from the files at apply time:
#   kubectl create configmap dojo-migrations -n devops-dojo --from-file=db/migrations/
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: devops-dojo
spec:
  backoffLimit: 10   # retry until Postgres is ready
  template:
    metadata:
      labels:
        app: migrate   # so NetworkPolicy + Kyverno (require-app-label) apply to it
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: migrate/migrate:v4.18.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - "-path=/migrations"
            - "-database=$(DATABASE_URL)"
            - "up"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dojo-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
      volumes:
        - name: migrations
          configMap:
            name: dojo-migrations
