# cert-manager Issuers. `selfsigned` works offline (local/kind). `letsencrypt-staging`
# issues real (staging) certs for a public domain via an HTTP-01 challenge through
# the local Gateway. Requires cert-manager with Gateway API support enabled.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: dojo
                namespace: devops-dojo
                kind: Gateway
