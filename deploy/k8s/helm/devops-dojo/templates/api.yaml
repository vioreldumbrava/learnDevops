{{/* api = the shared shapes from dojo-lib (lab 46) + everything api-specific below. */}}
{{- include "dojo-lib.service" (dict "name" "api" "port" 8080) }}
---
{{ include "dojo-lib.deployment" (dict
      "name"             "api"
      "replicas"         .Values.api.replicas
      "image"            (printf "%s:%s" .Values.image.api.repository .Values.image.api.tag)
      "pullPolicy"       .Values.image.api.pullPolicy
      "port"             8080
      "envFromConfigMap" "dojo-config"
      "env" (list (dict "name" "DATABASE_URL" "valueFrom" (dict "secretKeyRef" (dict "name" "dojo-secrets" "key" "DATABASE_URL"))))
      "livenessProbe"  (dict "httpGet" (dict "path" "/healthz" "port" 8080) "initialDelaySeconds" 5 "periodSeconds" 10)
      "readinessProbe" (dict "httpGet" (dict "path" "/readyz" "port" 8080) "initialDelaySeconds" 5 "periodSeconds" 5)
      "resources"        .Values.api.resources) }}
