{{- if .Values.gateway.enabled }}
{{- if and .Values.gateway.create .Values.gateway.localEnvoyProxy.enabled }}
# Local kind infrastructure only. Cloud releases disable this and let their
# GatewayClass/controller provision the data plane.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dojo-local-proxy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: {{ .Values.gateway.localEnvoyProxy.httpNodePort }}
                - name: https-443
                  port: 443
                  nodePort: {{ .Values.gateway.localEnvoyProxy.httpsNodePort }}
---
{{- end }}
{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.parentName }}
spec:
  gatewayClassName: {{ .Values.gateway.className | quote }}
  {{- if .Values.gateway.localEnvoyProxy.enabled }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: dojo-local-proxy
  {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dojo
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentName }}
      {{- with .Values.gateway.parentNamespace }}
      namespace: {{ . | quote }}
      {{- end }}
      sectionName: http
  {{- with .Values.gateway.host }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
{{- end }}
