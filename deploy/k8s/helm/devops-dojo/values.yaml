# Values for the DevOps Dojo chart. Override with --set or -f my-values.yaml.

image:
  api:
    repository: devops-dojo/api
    tag: dev
    pullPolicy: IfNotPresent
  frontend:
    repository: devops-dojo/frontend
    tag: dev
    pullPolicy: IfNotPresent

api:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

frontend:
  replicas: 2

worker:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

postgres:
  # Disable this when a GitOps release uses managed RDS. The stable `db`
  # Service name is omitted with the StatefulSet; workloads use DATABASE_URL.
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi

redis:
  image: redis:7-alpine

# Non-secret app configuration (rendered into a ConfigMap).
config:
  postgresDb: dojo
  postgresUser: dojo
  redisUrl: redis://redis:6379/0
  otelServiceName: dojo-api
  otelEndpoint: ""

secrets:
  # Workloads reference this name. Lab 40 changes it to `dojo-rds-secrets`
  # during the GitOps handoff so Argo can prune its old local Secret without
  # deleting the independently owned RDS Secret.
  name: dojo-secrets
  # true  -> the chart renders the `dojo-secrets` Secret from postgresPassword below
  #          (fine for local/dev/CI).
  # false -> you manage `dojo-secrets` externally (Sealed Secrets or the External
  #          Secrets Operator). Set `name` to that independently owned Secret.
  #          See deploy/secrets/ and lab 26.
  create: true
  # Demo value only. For real installs pass --set secrets.postgresPassword=... ,
  # or set create=false and provide the Secret via a secrets manager.
  postgresPassword: change-me-in-real-life

migrate:
  image: migrate/migrate:v4.18.1
  # Create it first: kubectl create configmap dojo-migrations -n <ns> --from-file=db/migrations/
  migrationsConfigMap: dojo-migrations

gateway:
  enabled: true
  # The default single-release kind path creates both the Gateway and a local
  # EnvoyProxy with deterministic NodePorts. Cloud or shared-Gateway releases
  # override these switches without changing the HTTPRoute template.
  create: true
  className: eg
  parentName: dojo
  parentNamespace: ""
  localEnvoyProxy:
    enabled: true
    httpNodePort: 30080
    httpsNodePort: 30443
  # Optional hostname so several releases can share one Gateway implementation.
  # Empty matches every host, which is convenient for a single local environment.
  host: ""

# Historical migration option only. To compare the retired Ingress API path,
# set gateway.enabled=false and ingress.enabled=true with a controller you manage.
ingress:
  enabled: false
  className: nginx
  host: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 60
