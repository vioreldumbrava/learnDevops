# kind cluster with the default CNI disabled so Calico can be installed — Calico
# ENFORCES NetworkPolicy (kindnet does not). Host port 80 maps to Envoy Gateway's
# fixed NodePort 30080 (see deploy/k8s/base/gateway.yaml).
# After creating: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
