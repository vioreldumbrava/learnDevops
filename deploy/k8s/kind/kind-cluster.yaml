# kind cluster wired for the Envoy Gateway NodePort in base/gateway.yaml.
# Requests to localhost:80 enter the node on the fixed service port 30080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
