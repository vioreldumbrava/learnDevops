# Companion policies for the historical ingress-nginx migration exercise.
# They are deliberately outside the main policy set so the supported Envoy path
# does not retain permissions for a retired controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legacy-ingress-nginx-to-api
  namespace: devops-dojo
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legacy-ingress-nginx-to-frontend
  namespace: devops-dojo
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 80 }
