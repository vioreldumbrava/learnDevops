# Zero-trust networking for the devops-dojo namespace: deny everything, then allow
# only the flows the app actually needs. NOTE: NetworkPolicy is only ENFORCED by a
# CNI that supports it — the default kind CNI (kindnet) does NOT. Use the Calico
# kind config (deploy/k8s/kind/kind-calico.yaml) or a cloud CNI that enforces it.

# 1) Default deny all ingress and egress in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: devops-dojo
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2) Allow every pod to resolve DNS (egress to kube-dns in kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: devops-dojo
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3) API: accept from frontend + the Envoy Gateway data plane (8080); reach db + redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: devops-dojo
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: frontend } }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: db } }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { protocol: TCP, port: 6379 }
---
# 4) Frontend: accept from the Envoy Gateway data plane (80); reach the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: devops-dojo
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - { protocol: TCP, port: 80 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: api } }
      ports:
        - { protocol: TCP, port: 8080 }
---
# 5) Postgres: accept from the API and the one-shot migrate Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db
  namespace: devops-dojo
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: api } }
        - podSelector: { matchLabels: { app: migrate } }
      ports:
        - { protocol: TCP, port: 5432 }
---
# 6) Redis: accept from the API and the worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: devops-dojo
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: api } }
        - podSelector: { matchLabels: { app: worker } }
        # KEDA (lab 31) polls the queue length from the keda namespace. Harmless
        # if KEDA isn't installed (no pods match).
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keda } }
      ports:
        - { protocol: TCP, port: 6379 }
---
# 7) Worker: reach Redis (egress only; nothing connects to it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  namespace: devops-dojo
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { protocol: TCP, port: 6379 }
---
# 8) Migrate Job: reach Postgres to apply schema migrations (egress only).
# DNS is already allowed for all pods by the allow-dns policy above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: devops-dojo
spec:
  podSelector:
    matchLabels:
      app: migrate
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: db } }
      ports:
        - { protocol: TCP, port: 5432 }
