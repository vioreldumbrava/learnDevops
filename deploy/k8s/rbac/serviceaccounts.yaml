# Least privilege: the app doesn't call the Kubernetes API, so it gets a dedicated
# ServiceAccount with the token NOT mounted. A separate read-only SA demonstrates
# granting scoped access via RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dojo-api
  namespace: devops-dojo
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-viewer
  namespace: devops-dojo
