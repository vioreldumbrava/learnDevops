# Lab 53, step 1 — two identical pods, one number apart. The scheduler does
# ARITHMETIC on requests (never on live usage): "greedy" asks for 64 CPUs no
# node can offer and stays Pending forever; "modest" asks for 100m and runs.
# Side by side so you can compare their describe/events.
apiVersion: v1
kind: Pod
metadata:
  name: greedy
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile: { type: RuntimeDefault }
    sysctls:
      - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
  containers:
    - name: app
      image: nginx:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      resources:
        requests:
          cpu: "64"          # <- more than any node's allocatable
---
apiVersion: v1
kind: Pod
metadata:
  name: modest
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile: { type: RuntimeDefault }
    sysctls:
      - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
  containers:
    - name: app
      image: nginx:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      resources:
        requests:
          cpu: "100m"
