# Lab 53, step 4 — node affinity: nodeSelector's expressive successor, in both
# strengths. "require-fast" HARD-requires a disk=fast node (Pending until one
# exists); "prefer-fast" only scores such nodes higher and schedules anywhere
# when none qualify. The strength is spelled out in the field names —
# *DuringScheduling* (gates placement) *IgnoredDuringExecution* (never evicts).
apiVersion: v1
kind: Pod
metadata:
  name: require-fast
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile: { type: RuntimeDefault }
    sysctls:
      - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disk
                operator: In
                values: ["fast"]
  containers:
    - name: app
      image: nginx:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      resources:
        requests:
          cpu: "50m"
---
apiVersion: v1
kind: Pod
metadata:
  name: prefer-fast
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile: { type: RuntimeDefault }
    sysctls:
      - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
              - key: disk
                operator: In
                values: ["fast"]
  containers:
    - name: app
      image: nginx:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      resources:
        requests:
          cpu: "50m"
