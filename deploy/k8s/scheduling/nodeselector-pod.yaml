# Lab 53, step 2 — nodeSelector: the bluntest placement tool. The pod may only
# land on a node carrying EXACTLY this label. No label anywhere -> Pending.
# The step labels a worker, watches the pod land, then removes the label and
# proves the running pod DOESN'T move (scheduling is a one-shot decision).
apiVersion: v1
kind: Pod
metadata:
  name: picky
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile: { type: RuntimeDefault }
    sysctls:
      - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
  nodeSelector:
    disk: fast
  containers:
    - name: app
      image: nginx:1.27-alpine
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      resources:
        requests:
          cpu: "50m"
