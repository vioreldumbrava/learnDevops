# Lab 52, step 2 — the "first consumer" the PVC has been waiting for. The
# moment this pod is scheduled, the provisioner knows WHICH NODE the volume
# must live on, creates the PV there, and the PVC binds. The pod appends a
# timestamp every 5s so later steps can check the data survived.
apiVersion: v1
kind: Pod
metadata:
  name: writer
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/log; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-dynamic
