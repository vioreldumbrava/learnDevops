# Lab 52, step 3 — the same provisioner as kind's default class, with ONE field
# changed: reclaimPolicy Retain instead of Delete. Delete = the PV (and data)
# dies with the PVC. Retain = deleting the PVC leaves the PV "Released" and the
# bytes on disk — recovering them is a deliberate manual act. This file stands
# up the whole scenario: class + claim + a writer pod.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard-retain
provisioner: rancher.io/local-path        # same engine as kind's "standard"
reclaimPolicy: Retain                     # <- the point of this file
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-retain
spec:
  storageClassName: standard-retain       # explicit: opt OUT of the default class
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer-retain
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/log; sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-retain
