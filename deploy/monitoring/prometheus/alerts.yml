groups:
  - name: dojo-availability
    rules:
      - alert: ApiDown
        expr: up{job="dojo-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DevOps Dojo API is down"
          description: "Prometheus has not been able to scrape the api target for 1 minute."

        # NOTE (lab 56): ApiDown stays. "The service is gone" is a symptom you always
        # want paged immediately, and no burn-rate window beats `up == 0` for it — with
        # zero traffic there is no error *ratio* to compute at all.

  # HighErrorRate and HighLatencyP95 used to live here. They were retired in lab 56 and
  # replaced by the burn-rate alerts in slo-rules.yml. Keeping the reasoning, because the
  # trade-off is the interview answer:
  #
  #   A static threshold ("5xx > 5% for 5 minutes") has no idea how much reliability you
  #   have left to spend. It pages at 3am for a 6-minute blip that cost 0.02% of the
  #   month's budget, and it stays silent through a 3% error rate that quietly exhausts
  #   the budget over a fortnight. Both are the wrong call, and the first one is worse,
  #   because alert fatigue is how real pages get ignored.
  #
  #   A burn-rate alert asks a different question: at the current rate, when do I run out
  #   of budget? That makes urgency and severity fall out of arithmetic instead of taste —
  #   fast burn pages, slow creep opens a ticket.
  #
  #   What you give up: burn-rate alerts need meaningful traffic (the ratio is noise at
  #   3 requests/minute) and they are harder to explain to someone who hasn't met SLOs.
  #   For a low-traffic internal service, a static threshold is still the honest choice.
