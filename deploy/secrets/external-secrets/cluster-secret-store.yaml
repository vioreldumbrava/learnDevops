# A cluster-wide connection to AWS Secrets Manager for the External Secrets Operator.
# The referenced ServiceAccount must be bound (via IRSA on EKS) to an IAM role that
# allows secretsmanager:GetSecretValue on the secrets you sync.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets            # SA annotated with the IRSA role ARN
            namespace: external-secrets
