# Syncs the AWS Secrets Manager secret `devops-dojo/postgres` into a Kubernetes
# Secret named `dojo-secrets` — the exact name the app workloads consume. ESO
# refreshes it on the interval below, so rotations in AWS propagate automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dojo-secrets
  namespace: devops-dojo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: dojo-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: devops-dojo/postgres
        property: password
    - secretKey: DATABASE_URL
      remoteRef:
        key: devops-dojo/postgres
        property: database_url
