# The CustomResourceDefinition: this single apply teaches the API server a new
# REST endpoint (/apis/dojo.dev/v1alpha1/namespaces/*/dojobackups) with schema
# validation, kubectl support and its own storage in etcd — no operator code
# involved yet. Normally generated by `controller-gen crd` from the markers in
# api/v1alpha1/dojobackup_types.go; committed here so lab 01 needs nothing but
# kubectl. The openAPIV3Schema below is what rejects a bad spec at APPLY time
# (try schedule: 5 — a number — and watch the server refuse it).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dojobackups.dojo.dev   # must be <plural>.<group>
spec:
  group: dojo.dev
  names:
    kind: DojoBackup
    listKind: DojoBackupList
    plural: dojobackups
    singular: dojobackup
    shortNames: ["djb"]        # enables `kubectl get djb`
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true             # the API server serves this version...
      storage: true            # ...and stores objects in this version in etcd
      # The /status subresource splits writes: users update spec, controllers
      # update status, and neither can accidentally clobber the other.
      subresources:
        status: {}
      # Extra columns for `kubectl get dojobackup` — small thing, huge UX.
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: LastSuccess
          type: date
          jsonPath: .status.lastSuccessfulTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["schedule", "database"]
              properties:
                schedule:
                  type: string
                  description: Cron schedule for backups, e.g. "0 3 * * *".
                  # Loose cron shape check — real validation happens when the
                  # CronJob is created; this catches obvious garbage earlier.
                  minLength: 9
                retention:
                  type: integer
                  format: int32
                  default: 5
                  minimum: 1
                  description: Keep the newest N dump files.
                storageSize:
                  type: string
                  default: "1Gi"
                  description: Size of the PVC that stores the dumps.
                suspend:
                  type: boolean
                  description: Pause the schedule without deleting anything.
                database:
                  type: object
                  required: ["host", "name", "user", "passwordSecret"]
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
                      format: int32
                      default: 5432
                    name:
                      type: string
                    user:
                      type: string
                    passwordSecret:
                      type: object
                      required: ["name", "key"]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "reason", "lastTransitionTime", "message"]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                      observedGeneration: { type: integer, format: int64 }
                activeJobs:
                  type: integer
                  format: int32
                lastScheduleTime:
                  type: string
                  format: date-time
                lastSuccessfulTime:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
